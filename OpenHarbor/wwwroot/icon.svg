  <!-- Server stack docked in the harbor -->
  <rect x="196" y="236" width="120" height="38" rx="10" fill="#3DD6C6"/>
  <rect x="196" y="284" width="120" height="38" rx="10" fill="#3DD6C6"/>
  <circle cx="220" cy="255" r="6" fill="#0F2A3D"/>
  <circle cx="220" cy="303" r="6" fill="#0F2A3D"/>
